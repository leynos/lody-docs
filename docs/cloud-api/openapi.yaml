  /api/auth/mobile/start:
    get:
      operationId: startNativeAuth
      summary: Start GitHub or Discord native browser sign-in
      description: Browser handoff uses PKCE S256. Keep verifier local and compare returned state. The
        callback carries a one-use code, not a session credential. Redirect sequence and exact
        status codes are private.
      tags:
        - Authentication
      x-source: apps/mobile/ios/packages/LodyKit/Sources/LodyKit/Auth/NativeAuthHandoff.swift
      responses:
        2XX:
          description: Client accepts a successful HTTP response. Exact success status is not fixed by source.
        default:
          description: Request failed. Exact error body and status depend on the hosted handler; do not assume
            a common error schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservedError"
            text/plain:
              schema:
                type: string
        3XX:
          description: Browser redirect during provider sign-in; chain is deployment-defined.
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum:
              - github
              - discord
        - name: redirect_uri
          in: query
          required: true
          schema:
            const: lody://auth/mobile-callback
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            const: S256
