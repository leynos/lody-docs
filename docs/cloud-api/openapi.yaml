  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      description: Raw Better Auth session token. Use the JSON token returned by sign-in; a signed
        set-auth-token cookie value is not interchangeable.
    CliKey:
      type: http
      scheme: bearer
      description: CLI API key. Some Convex operations instead take cliToken/token inside args.
    ConvexJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived token returned by GET /api/auth/convex/token.
    ShareRead:
      type: http
      scheme: bearer
      description: "Per-share read secret: 32 random bytes as 64 lowercase hex characters; extracted from
        #access=v1.<secret>. Never send the workspace credential."
    ShareUpload:
      type: http
      scheme: bearer
      description: Per-deployment upload secret. Can upload/seal, cannot publish.
