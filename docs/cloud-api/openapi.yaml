  /api/cli/machine-pairing/exchange:
    post:
      operationId: exchangeMachinePairing
      summary: Exchange a connection token for a temporary machine API key
      description: Token starts with lody_pair_. Public shared TTL is 30 minutes. Retry the same command
        on reachability failures; validate the returned key through deviceAuth:validateCliToken.
        This is distinct from encrypted-device pairing.
      tags:
        - CLI credentials
      x-source: apps/cli/src/lib/auth.ts
      responses:
        "400":
          description: Client treats token as invalid or expired.
        "401":
          description: Client treats token as invalid or expired.
        "404":
          description: Client treats token as invalid or expired.
        "410":
          description: Client treats token as invalid or expired.
        2XX:
          description: Client accepts a successful HTTP response. Exact success status is not fixed by source.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                required:
                  - apiKey
        default:
          description: Request failed. Exact error body and status depend on the hosted handler; do not assume
            a common error schema.
          content:
