openapi: 3.1.1
info:
  title: Lody Cloud HTTP API — public client contract
  version: source-61bd9701a5ed
  description: "Source-derived documentation of optional Lody Cloud HTTP clients. Hosted handlers are
    private: x-source identifies client evidence, not server validation. See README.md for coverage,
    credentials, protocol boundaries, and known discrepancies. This is not a promise that every
    route is available to third-party callers."
servers:
  - url: https://backend.lody.ai
    description: Authentication and purpose-bound authorization ingress
security:
  - SessionBearer: []
tags:
  - name: Authentication
  - name: CLI credentials
  - name: Authorization proofs
  - name: Attachments
  - name: Sharing
  - name: Runtime downloads
  - name: Utilities
  - name: Convex
paths:
  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      summary: Sign in with email and password
      description: Observed public client contract. Server validation, complete error bodies, rate limits
        and deployment availability are not published in this checkout.
      tags:
        - Authentication
      x-source: apps/mobile/android/app/src/main/kotlin/app/lody/android/auth/CloudAuthHttp.kt
      responses:
        2XX:
          description: Client accepts a successful HTTP response. Exact success status is not fixed by source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialReply"
        default:
          description: Request failed. Exact error body and status depend on the hosted handler; do not assume
            a common error schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservedError"
            text/plain:
              schema:
                type: string
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                callbackURL:
                  type: string
              required:
                - email
                - password
                - callbackURL
            example:
              email: reader@example.test
              password: synthetic-example-password
              callbackURL: https://backend.lody.ai/api/auth/mobile/email-verified
  /api/auth/sign-up/email:
    post:
      operationId: signUpEmail
      summary: Register with email and password
      description: Native callbackURL is https://backend.lody.ai/api/auth/mobile/email-verified. A
        successful registration can still require email verification; a usable token is not
